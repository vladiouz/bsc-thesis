[package]
name = "arbitrage-bot"
version = "0.2.3"
edition = "2024"

[dependencies]
multiversx-sdk = "0.14.2"
multiversx-sc = "0.64.1"
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"
hex = "0.4.3"
base64 = "0.22"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
multiversx-sc-scenario = "0.64.1"
multiversx-sc-snippets = "0.64.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
arbitrage_interactor = { path = "../arbitrage-sc/interactor" }
chrono = "0.4.44"
amqprs = "2.1.5"
futures = "0.3.32"
async-trait = "0.1.89"
