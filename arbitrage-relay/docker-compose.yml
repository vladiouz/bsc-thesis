networks:
  notifier-net:
    driver: bridge
  gateway-net:
    ipam:
      config:
        - subnet: 10.0.2.0/24

services:
  redis-master:
    image: "bitnami/redis"
    environment:
      - REDIS_REPLICATION_MODE=master
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
        - "6379:6379"
    networks:
      - notifier-net
  redis-sentinel:
    image: "bitnami/redis-sentinel"
    environment:
      - REDIS_MASTER_SET=mymaster
      - REDIS_MASTER_HOST=redis-master
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=10000
    depends_on:
      - redis-master
    ports:
        - "26379:26379"
    networks:
      - notifier-net

  rabbitmq:
    image: "rabbitmq:3-management"
    volumes:
      - ./rabbitmq-configs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-configs/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
        - "5672:5672"
        - "15672:15672"
    networks:
      - notifier-net

  observer-1:
    image: ${OBSERVER_IMAGE}
    ports:
     - "8081:8080"
     - "10001:37373"
    environment:
      - SHARD=1 
    volumes:
      - ${SQUAD_DIRECTORY}/node-1/db:/go/mx-chain-go/cmd/node/db
      - ${SQUAD_DIRECTORY}/node-1/logs:/go/mx-chain-go/cmd/node/logs
      - ${SQUAD_DIRECTORY}/node-1/config:/config
    command: --destination-shard-as-observer=${SHARD_1} --validator-key-pem-file=/config/observerKey_${SHARD_1}.pem --display-name="${DISPLAY_NAME_1}" --operation-mode=snapshotless-observer
    networks:
      notifier-net:
      gateway-net:
        ipv4_address: 10.0.2.5

  notifier:
    build:
      context: ./mx-chain-notifier-go
    image: notifier:local
    container_name: notifier
    command:
      - --publisher-type
      - rabbitmq
      - --log-level=*:DEBUG
    volumes:
      - ./mx-chain-notifier-go/cmd/notifier/config:/multiversx/config:ro
    restart: unless-stopped
    networks:
      - notifier-net

  proxy:
    image: mx-proxy:v1.3.4.1
    ports:
      - "8079:8079"
    environment:
      - IP=10.0.2.2
    command: ["--start-swagger-ui"]
    networks:
      gateway-net:
        ipv4_address: 10.0.2.2
